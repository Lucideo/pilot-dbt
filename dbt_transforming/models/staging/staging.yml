models:
  - name: stg_orders
    description: "One row per order."
    columns:
      - name: order_id
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'completed', 'returned']
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_payments
    description: "One row per payment, amount in reais."
    columns:
      - name: payment_id
        data_tests: [unique, not_null]

  - name: stg_customers
    description: "One row per customer."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]